<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Lekhini Overlay</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
      }
      #root, .overlay-root {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      canvas {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: transparent;
      }
      .board {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .edutictac-cursor {
        position: absolute;
        z-index: 40;
        transform: translate(-50%, -50%);
        border: 3px solid currentColor;
        border-radius: 50%;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.65), inset 0 0 4px rgba(255, 255, 255, 0.3);
        pointer-events: none;
        will-change: left, top;
      }
      .edutictac-spotlight {
        position: absolute;
        inset: 0;
        z-index: 38;
        pointer-events: none;
      }
      .edutictac-magnifier {
        position: absolute;
        z-index: 42;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        box-sizing: border-box;
        background: #111;
        box-shadow: 0 5px 22px rgba(0, 0, 0, 0.55), 0 1px 5px rgba(0, 0, 0, 0.75);
        pointer-events: none;
      }
      .edutictac-keystrokes {
        position: absolute;
        z-index: 44;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 28px;
        pointer-events: none;
      }
      .edutictac-keystrokes-top-left { top: 0; left: 0; align-items: flex-start; }
      .edutictac-keystrokes-top-center { top: 0; left: 50%; transform: translateX(-50%); align-items: center; }
      .edutictac-keystrokes-top-right { top: 0; right: 0; align-items: flex-end; }
      .edutictac-keystrokes-bottom-left { bottom: 0; left: 0; align-items: flex-start; }
      .edutictac-keystrokes-bottom-center { bottom: 0; left: 50%; transform: translateX(-50%); align-items: center; }
      .edutictac-keystrokes-bottom-right { bottom: 0; right: 0; align-items: flex-end; }
      .edutictac-keystroke {
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.38);
        padding: 8px 14px;
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 650;
        line-height: 1.1;
        white-space: nowrap;
        animation: edutictac-keystroke-in 120ms ease-out both;
      }
      @keyframes edutictac-keystroke-in {
        from { transform: translateY(6px) scale(0.96); opacity: 0; }
        to { transform: translateY(0) scale(1); }
      }
      .edutictac-cursor-dot {
        border: 0;
        background: currentColor;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.65);
      }
      .edutictac-click {
        position: absolute;
        z-index: 39;
        transform: translate(-50%, -50%);
        border: 3px solid currentColor;
        border-radius: 50%;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.55);
        pointer-events: none;
        animation-name: edutictac-click-ripple;
        animation-timing-function: ease-out;
        animation-fill-mode: both;
      }
      .edutictac-click-right { border-style: dashed; }
      .edutictac-click-middle { border-width: 5px; }
      .edutictac-click span {
        position: absolute; inset: 0; display: grid; place-items: center;
        color: currentColor; font: 700 12px system-ui, sans-serif;
      }
      @keyframes edutictac-click-ripple {
        from { transform: translate(-50%, -50%) scale(0.25); opacity: 1; }
        to { transform: translate(-50%, -50%) scale(1.1); opacity: 0; }
      }
      .capture-surface {
        position: absolute;
        inset: 0;
        background: transparent;
        cursor: crosshair;
      }
      .capture-surface[data-draw='false'] {
        display: none;
      }

      /* Tool-aware cursors are set dynamically from cursors.ts so they can
         track the active color and width. The defaults below render before
         JS has mounted. */
      .capture-surface[data-tool='hand'] { cursor: grab; }
      .capture-surface[data-tool='hand']:active { cursor: grabbing; }
      .capture-surface[data-tool='text'] { cursor: text; }
      .text-prompt {
        position: absolute;
        background: rgba(20, 20, 22, 0.92);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 6px 8px;
        font-size: 14px;
        outline: none;
        min-width: 160px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      /* Snip action menu — Copy / Save / Cancel pinned to the
         bottom-right of a completed snip selection. Sits ABOVE the
         capture-surface in DOM order so clicks land on buttons rather
         than the underlying drawing surface; we also stopPropagation
         on pointerdown defensively. */
      .snip-actions {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px;
        background: rgba(20, 20, 22, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        font-size: 12px;
        line-height: 1;
        z-index: 50;
        animation: snipActionsIn 0.14s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      @keyframes snipActionsIn {
        from { opacity: 0; transform: translateY(-2px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      .snip-action {
        appearance: none;
        background: transparent;
        color: #e4e4e6;
        border: 1px solid transparent;
        border-radius: 5px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
      }
      .snip-action:hover { background: rgba(255, 255, 255, 0.08); }
      .snip-action:active { background: rgba(255, 255, 255, 0.14); }
      .snip-action[disabled] { opacity: 0.55; cursor: progress; }
      .snip-action[disabled]:hover { background: transparent; }
      .snip-action-primary[disabled]:hover { filter: none; }
      .snip-action-primary {
        background: linear-gradient(180deg, #d8b572 0%, #b89150 100%);
        color: #1c1c1e;
        font-weight: 600;
      }
      .snip-action-primary:hover { filter: brightness(1.05); }
      /* Ask AI gets a distinct accent so it reads as a different
         class of action than Copy/Save (which manipulate the
         clipboard / file system). Muted purple-ish blue. */
      .snip-action-ai {
        background: rgba(132, 109, 224, 0.18);
        color: #b6a7ff;
        border-color: rgba(132, 109, 224, 0.35);
        font-weight: 600;
      }
      .snip-action-ai:hover {
        background: rgba(132, 109, 224, 0.30);
        color: #ffffff;
      }
      .snip-action-quiet {
        color: rgba(228, 228, 230, 0.65);
        padding: 6px 8px;
        font-size: 13px;
      }
      .snip-action-quiet:hover { color: #e4e4e6; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
